<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unggah Aset - NyomotAset</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <div class="logo">Nyomot<strong>Aset</strong></div>
        <nav>
            <a href="index.html">Beranda</a>
            <a href="assets.html">Aset Animasi</a>
            <a href="categories.html">Kategori</a>
            <a href="upload.html" class="active">Unggah Aset</a>
        </nav>
    </header>

    <!-- HALAMAN FORMULIR UNGGAH -->
    <section class="asset-section">
        <h2>Kontribusi Aset Animasi</h2>
        <p>Bagikan karya, karakter, atau properti buatanmu untuk membantu teman-teman sekelas.</p>

        <div class="upload-container">
            <form id="uploadForm" onsubmit="handleUpload(event)">
                <div class="form-group">
                    <label for="assetName">Nama Aset</label>
                    <input type="text" id="assetName" placeholder="Contoh: Karakter Robot 3D" required>
                </div>

                <div class="form-group">
                    <label for="assetCategory">Kategori</label>
                    <select id="assetCategory" required>
                        <option value="">-- Pilih Kategori --</option>
                        <option value="karakter">Karakter</option>
                        <option value="props">Props / Properti</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="assetFormat">Format File</label>
                    <input type="text" id="assetFormat" placeholder="Contoh: .blend / .fbx / .obj" required>
                </div>

                <div class="form-group">
                    <label for="uploaderName">Nama Pembuat / Kontributor</label>
                    <input type="text" id="uploaderName" placeholder="Nama kamu atau kelompok" required>
                </div>

                <div class="form-group">
                    <label for="fileLink">Link Unduhan (Google Drive / Mediafire)</label>
                    <input type="url" id="fileLink" placeholder="https://..." required>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer;">Kirim Aset</button>
            </form>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 NyomotAset - Dibuat dengan semangat oleh Muhammad Rakha Skenda.</p>
    </footer>

   <script src="script.js"></script>
</body>
</html>
